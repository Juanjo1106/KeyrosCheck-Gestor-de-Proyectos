<div *ngIf="!isLoggedIn" class="login-screen">
  <div class="login-card">
    <div class="brand-section">
      <img src="assets/images/logo.png" alt="Keyros Logo" class="logo">
      <p class="subtitle"><strong>GESTIÓN Y ACOMPAÑAMIENTO DE PROYECTOS.</strong></p>
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="input-group">
        <label for="nombre">Usuario:</label>
        <div class="input-wrapper">
          <input type="text" id="nombre" [(ngModel)]="nombre" name="nombre" placeholder="Ingresa tu usuario" required>
        </div>
      </div>

      <div class="input-group">
        <label for="pass">Contraseña:</label>
        <div class="input-wrapper">
          <input type="password" id="pass" [(ngModel)]="pass" name="pass" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" [disabled]="loading" class="btn-submit">
        <span *ngIf="!loading">ENTRAR</span>
        <span *ngIf="loading" class="loader">Cargando...</span>
      </button>
    </form>
  </div>
</div>

<div *ngIf="isLoggedIn" class="app-container">
<nav class="main-nav">
  <div class="nav-brand" routerLink="/empresas">
    <div class="logo-container">
      <img src="assets/images/logo.png" alt="Keyros Logo" class="nav-logo">
    </div>
    <span class="brand-text">Keyros <span class="text-accent">Check</span></span>
  </div>

  <div class="nav-actions">
<div class="user-status">
  <span class="dot"></span>
  <span class="status-label">Sesión Activa</span>
</div>
    <button class="btn-logout" (click)="logout()">
      <span>Cerrar Sesión</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-exit"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </button>
  </div>
</nav>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>
</div>
