<div class="proyectos-container">

  <header class="header">
    <button routerLink="/empresas" class="btn-back">
      ← Volver
    </button>
    <h1>
      Proyectos de: 
      <span class="empresa-nombre">{{ nombreEmpresa }}</span>
    </h1>
  </header>

  <div class="add-project-card">
    <input 
      type="text"
      [(ngModel)]="nombreProyecto"
      placeholder="Nombre del nuevo proyecto..."
      (keyup.enter)="crearProyecto()"
      class="input-proyecto"
    >

    <select [(ngModel)]="categoriaSeleccionada" class="select-categoria">
      <option value="">Seleccione categoría:</option>
      <option value="SUPERMERCADO">Supermercado</option>
      <option value="CARNICERIA">Carnicería</option>
      <option value="FRIGORIFICO">Frigorífico</option>
    </select>

    <button (click)="crearProyecto()" class="btn-create">
      CREAR PROYECTO
    </button>

    <div class="dropdown">
      <button class="btn-options" type="button" (click)="toggleOpciones()">
        OPCIONES ▼
      </button>

      <div *ngIf="mostrarOpciones" class="dropdown-menu">
        <button (click)="abrirModalReasignar()" class="dropdown-item">
          🔄 Reasignar proyecto
        </button>
      </div>
    </div>
  </div>

  <div class="proyectos-grid">
    <div class="proyecto-card" *ngFor="let proyecto of proyectos">
      <div class="proyecto-info">
        <h3>{{ proyecto.nombre }}</h3>
        <p class="dis_id">ID: #{{ proyecto.id_proyecto }}</p>
      </div>

      <button 
        [routerLink]="['/proyecto', proyecto.id_proyecto, empresaId, 'etapas']"
        class="btn-enter">
        ETAPAS
      </button>

      <button (click)="abrirModalReasignar(proyecto.id_proyecto)" class="btn-reassign">
        Reasignar Ubicación
      </button>
    </div>
  </div>

</div>

<div *ngIf="mostrarModalReasignar" class="modal-overlay">
  <div class="modal-container">
    
    <div class="modal-header-zone">
      <h3 class="modal-title">Reasignar Proyecto</h3>
      <p class="modal-subtitle">Transfiere el proyecto seleccionado a otra organización del sistema.</p>
    </div>

    <div *ngIf="proyectoSeleccionado" class="project-context-badge">
      <span class="badge-label">Proyecto en transferencia:</span>
      <span class="badge-value">#{{ proyectoSeleccionado }}</span>
    </div>

    <div *ngIf="!proyectoSeleccionado" class="form-group animate-fading">
      <label for="modalProyecto">Seleccionar Proyecto Objetivo</label>
      <div class="select-wrapper">
        <select id="modalProyecto" [(ngModel)]="proyectoSeleccionado" class="form-select">
          <option [ngValue]="null" disabled selected>-- Elige un proyecto de la lista --</option>
          <option *ngFor="let p of proyectos" [ngValue]="p.id_proyecto">
            {{ p.nombre }} (ID: #{{ p.id_proyecto }})
          </option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="modalEmpresa">Empresa Destino</label>
      <div class="select-wrapper">
        <select id="modalEmpresa" [(ngModel)]="empresaDestino" class="form-select">
          <option [ngValue]="null" disabled selected>-- Elige la nueva empresa --</option>
          <option *ngFor="let e of empresas" [ngValue]="e.id_empresa">
            {{ e.nombre }}
          </option>
        </select>
      </div>
    </div>

    <div class="modal-actions">
      <button 
        (click)="confirmarReasignacion()" 
        class="btn-confirm"
        [disabled]="!proyectoSeleccionado || !empresaDestino">
        Confirmar Cambio
      </button>
      
      <button (click)="cerrarModalReasignar()" class="btn-cancel">
        Cancelar
      </button>
    </div>

  </div>
</div>
